name: Build AIBG Antidetect Firefox (Linux x64 & ARM64 Ultra-Minimal)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag in siwtom/aibg-antidetect-engine"
        required: true
        default: "main"
      arch:
        description: "Target Linux Architecture (x64, arm64, or both)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: write

jobs:
  build-firefox-linux:
    name: Build AIBG Firefox Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event.inputs.arch == 'arm64' && fromJson('["arm64"]') || (github.event.inputs.arch == 'x64' && fromJson('["x64"]') || fromJson('["x64", "arm64"]')) }}

    steps:
      - name: Checkout AIBG Antidetect Core Engine
        uses: actions/checkout@v4
        with:
          repository: siwtom/aibg-antidetect-engine
          token: ${{ secrets.AIBG_ENGINE_TOKEN }}
          ref: ${{ github.event.inputs.source_ref || 'main' }}

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm pkg-config m4 \
            nasm yasm unzip zip xz-utils curl git jq sccache \
            libgtk-3-dev libdbus-1-dev libglib2.0-dev \
            libasound2-dev libpulse-dev libx11-xcb-dev libxt-dev \
            libdrm-dev libgbm-dev libxrandr-dev libxcomposite-dev \
            libxdamage-dev libxfixes-dev libxext-dev \
            python3 python3-pip python3-venv python3-websockets
          pip3 install --break-system-packages websockets || true

      - name: Cache Rust & Mozbuild Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            ~/.cache/sccache
          key: aibg-firefox-linux-${{ matrix.arch }}-${{ hashFiles('patches/firefox/BASE_COMMIT.txt') }}

      - name: Clone Upstream Firefox Base, Apply AIBG Overlays & Build Ultra-Minimal Linux
        run: |
          chmod +x linux/build_linux_firefox.sh
          ./linux/build_linux_firefox.sh "${{ matrix.arch }}" "$RUNNER_TEMP/firefox-src"

      - name: Upload Linux Ultra-Minimal Tarball & ZIP Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: AIBG-Firefox-Linux-Minimal-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/firefox-src/obj-*-unknown-linux-gnu-release/dist/minimal/AIBG-Firefox-Linux-Minimal-*.tar.xz
            ${{ runner.temp }}/firefox-src/obj-*-unknown-linux-gnu-release/dist/minimal/AIBG-Firefox-Linux-Minimal-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases (Public & Engine)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_TOKEN: ${{ secrets.AIBG_ENGINE_TOKEN }}
        run: |
          TAG_NAME="v161.0-linux"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "AIBG Antidetect Firefox Engine — Linux Ultra-Minimal Headless (x86_64 & ARM64)" \
              --notes "Automated Linux Ultra-Minimal Stealth Headless Release of AIBG Antidetect Firefox Engine (v161.0a1) optimized strictly for Google Flow Veo3 & Omni Flash, Google Vids, and ByteDance Dola (dola.com)."
          
          for f in ${{ runner.temp }}/firefox-src/obj-*-unknown-linux-gnu-release/dist/minimal/AIBG-Firefox-Linux-Minimal-*; do
            if [ -f "$f" ]; then
              gh release upload "$TAG_NAME" "$f" --clobber
              
              if [ -n "$ENGINE_TOKEN" ]; then
                GH_TOKEN="$ENGINE_TOKEN" gh release upload "$TAG_NAME" "$f" --repo siwtom/aibg-antidetect-engine --clobber || true
              fi
            fi
          done
